name: Deploy MkDocs to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate site sources
        run: |
          python - <<'EOF'
          from pathlib import Path
          errors = []
          for f in ["docs/index.md", "docs/watchlist/index.md", "docs/snapshots/index.md"]:
              if not Path(f).exists():
                  errors.append(f"Missing: {f}")
          wl = [p for p in Path("docs/watchlist").glob("*.md") if p.name != "index.md"]
          if len(wl) == 0:
              errors.append("docs/watchlist/ has no ticker .md files (gen.py may have failed locally)")
          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              raise SystemExit(1)
          print(f"OK: {len(wl)} watchlist files, index files present")
          EOF
      - run: mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
